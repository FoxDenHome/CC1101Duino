[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "protocol"]
known-third-party = ["homeassistant"]

[tool.ruff.lint.per-file-ignores]
# Captured radio lines are long
"tests/*" = ["E501"]
